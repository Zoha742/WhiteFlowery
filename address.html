<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Delivery Address</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0 0 90px 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 10px; font-size: 12px; text-decoration: none; }

        .form-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 10px; box-sizing: border-box; font-size: 13px; outline: none; }
        .action-btn { background: var(--primary-gradient); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; margin-top: 10px; }

        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999; }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-location-dot"></i> Saved Address</h3>
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Profile</a>
        </div>

        <div class="form-card">
            <div class="form-group"><label>Full Name</label><input type="text" id="savedName" class="form-control" placeholder="Your name"></div>
            <div class="form-group"><label>Phone Number</label><input type="text" id="savedPhone" class="form-control" placeholder="Phone number"></div>
            <div class="form-group"><label>Delivery Address</label><input type="text" id="savedAddr" class="form-control" placeholder="House, Area, City"></div>
            <button class="action-btn" onclick="saveAddress()">Save Address</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        function saveAddress() { tg.showAlert("✅ Address saved successfully!"); }
    </script>
</body>
</html>
