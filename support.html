<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Customer Support</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --accent-pink: #ec4899;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 90px 0;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 10px; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

        /* Support Card Form */
        .support-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .support-header-box { text-align: center; margin-bottom: 16px; }
        .support-icon {
            width: 55px; height: 55px;
            background: rgba(124, 58, 237, 0.15);
            color: #c084fc;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin: 0 auto 10px auto;
        }
        .support-header-box h3 { margin: 0 0 4px 0; font-size: 16px; color: #fff; }
        .support-header-box p { margin: 0; font-size: 11px; color: var(--text-muted); line-height: 1.4; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .form-control {
            width: 100%; background: #0b0f19; border: 1px solid var(--card-border);
            color: #fff; padding: 10px; border-radius: 10px; box-sizing: border-box;
            font-size: 13px; outline: none;
        }
        .form-control:focus { border-color: #7c3aed; }
        textarea.form-control { resize: none; height: 90px; }

        .submit-btn {
            background: var(--primary-gradient); color: #fff; border: none;
            padding: 12px; border-radius: 12px; font-weight: 700; width: 100%;
            cursor: pointer; font-size: 13px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .submit-btn:active { transform: scale(0.98); }

        /* Direct Telegram Support Box */
        .direct-chat {
            background: rgba(124, 58, 237, 0.08);
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }
        .direct-chat p { margin: 0 0 10px 0; font-size: 12px; color: var(--text-muted); }
        .tg-chat-btn {
            background: #229ed9; color: #fff; border: none; padding: 8px 16px;
            border-radius: 10px; font-size: 12px; font-weight: bold; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-headset"></i> Customer Support</h3>
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Profile</a>
        </div>

        <!-- Support Message Form -->
        <div class="support-card">
            <div class="support-header-box">
                <div class="support-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
                <h3>Send Message to Admin</h3>
                <p>Have an issue with your dress order or payment? Drop a message below, our admin will reply soon.</p>
            </div>

            <div class="form-group">
                <label>Your Subject / Issue</label>
                <input type="text" id="supportSubject" class="form-control" placeholder="e.g. Size exchange or Payment delay">
            </div>
            <div class="form-group">
                <label>Message Details</label>
                <textarea id="supportMessage" class="form-control" placeholder="Describe your problem clearly..."></textarea>
            </div>
            <button class="submit-btn" onclick="sendSupportMessage()">Submit Ticket</button>
        </div>

        <!-- Direct Telegram Contact -->
        <div class="direct-chat">
            <p>Need urgent help? Chat instantly with our manager.</p>
            <a href="https://t.me/adsonar_manager" target="_blank" class="tg-chat-btn">
                <i class="fa-brands fa-telegram"></i> Open Telegram Chat
            </a>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        // আপনার ফায়ারবেস কনফিগারেশন এখানে যুক্ত হবে
        
        let tg = window.Telegram.WebApp;
        tg.expand();

        window.sendSupportMessage = function() {
            let subject = document.getElementById('supportSubject').value.trim();
            let message = document.getElementById('supportMessage').value.trim();

            if(!subject || !message) {
                tg.showAlert("⚠️ Please fill up both subject and message!");
                return;
            }

            // এখানে ফায়ারবেসে ডাটা সেভ করার কোড যুক্ত হবে, যা পরবর্তী অ্যাডমিন প্যানেল থেকে কন্ট্রোল করা যাবে।
            tg.showAlert("✅ Support ticket submitted successfully! Admin will check it soon.");
            document.getElementById('supportSubject').value = '';
            document.getElementById('supportMessage').value = '';
        }
    </script>
</body>
</html>
