<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - My Orders</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 90px 0;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 10px; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

        /* Order Card Style */
        .orders-list { display: flex; flex-direction: column; gap: 14px; }
        .order-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 16px; position: relative;
        }
        .order-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 12px;
            font-size: 12px;
        }
        .order-id { color: #c084fc; font-weight: bold; }
        
        /* Status Badges */
        .status-badge { font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .status-accepted { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-cancelled { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }

        .order-details { font-size: 13px; margin-bottom: 10px; }
        .dress-name { font-weight: bold; color: #fff; margin-bottom: 4px; font-size: 14px; }
        .dress-specs { display: flex; gap: 12px; color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
        .spec-item { background: #0b0f19; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--card-border); }

        .order-footer {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--card-border); padding-top: 10px; margin-top: 10px;
        }
        .total-label { font-size: 11px; color: var(--text-muted); }
        .total-amount { font-size: 15px; font-weight: bold; color: #fbbf24; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-box-archive"></i> My Orders</h3>
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Profile</a>
        </div>

        <!-- Orders List Container -->
        <div class="orders-list">
            
            <!-- Order Item 1 (Accepted Example) -->
            <div class="order-card">
                <div class="order-header">
                    <span class="order-id">#WF-9021</span>
                    <span class="status-badge status-accepted"><i class="fa-solid fa-check-circle"></i> Accepted</span>
                </div>
                <div class="order-details">
                    <div class="dress-name">Royal Silk Gown</div>
                    <div class="dress-specs">
                        <span class="spec-item">Size: <b>L</b></span>
                        <span class="spec-item">Qty: <b>2 Pcs</b></span>
                    </div>
                </div>
                <div class="order-footer">
                    <div>
                        <span class="total-label">Total Payment</span>
                    </div>
                    <div class="total-amount">৳ 17,000</div>
                </div>
            </div>

            <!-- Order Item 2 (Pending Example) -->
            <div class="order-card">
                <div class="order-header">
                    <span class="order-id">#WF-9022</span>
                    <span class="status-badge status-pending"><i class="fa-solid fa-clock"></i> Pending</span>
                </div>
                <div class="order-details">
                    <div class="dress-name">White Floral Maxi</div>
                    <div class="dress-specs">
                        <span class="spec-item">Size: <b>M</b></span>
                        <span class="spec-item">Qty: <b>1 Pc</b></span>
                    </div>
                </div>
                <div class="order-footer">
                    <div>
                        <span class="total-label">Total Payment</span>
                    </div>
                    <div class="total-amount">৳ 3,500</div>
                </div>
            </div>

            <!-- Order Item 3 (Cancelled Example) -->
            <div class="order-card">
                <div class="order-header">
                    <span class="order-id">#WF-9018</span>
                    <span class="status-badge status-cancelled"><i class="fa-solid fa-xmark-circle"></i> Cancelled</span>
                </div>
                <div class="order-details">
                    <div class="dress-name">Velvet Winter Gown</div>
                    <div class="dress-specs">
                        <span class="spec-item">Size: <b>XL</b></span>
                        <span class="spec-item">Qty: <b>1 Pc</b></span>
                    </div>
                </div>
                <div class="order-footer">
                    <div>
                        <span class="total-label">Total Payment</span>
                    </div>
                    <div class="total-amount">৳ 9,500</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
