<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Profile Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: linear-gradient(135deg, rgba(19, 28, 46, 0.8) 0%, rgba(11, 15, 25, 0.9) 100%);
            --card-border: rgba(124, 58, 237, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 100px 0;
            display: flex; justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.15) 0%, transparent 60%);
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .back-btn { background: rgba(19, 28, 46, 0.9); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 14px; border-radius: 12px; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); }

        /* Profile Hero with ID */
        .profile-hero {
            background: linear-gradient(135deg, #131c2e 0%, #1e1b4b 100%);
            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 24px;
            padding: 24px 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px -5px rgba(124, 58, 237, 0.25);
            position: relative;
            overflow: hidden;
        }
        .profile-avatar {
            width: 70px; height: 70px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #fff;
            margin: 0 auto 10px auto;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);
        }
        .profile-name { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; color: #fff; }
        .profile-id-tag {
            display: inline-block;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.4);
            padding: 4px 12px; border-radius: 20px;
            font-size: 11px; color: #d8b4fe; font-weight: bold;
            margin-top: 4px;
        }

        /* Admin Control Panel Banner */
        .admin-banner-card {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(124, 58, 237, 0.15) 100%);
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 18px; padding: 14px 16px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: #fff; transition: 0.2s;
        }
        .admin-banner-card:active { transform: scale(0.98); }
        .admin-info { display: flex; align-items: center; gap: 12px; }
        .admin-icon-box {
            width: 40px; height: 40px; background: var(--accent-gradient);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff;
        }
        .admin-text h4 { margin: 0 0 2px 0; font-size: 13px; font-weight: 700; color: #fff; }
        .admin-text p { margin: 0; font-size: 10px; color: #fbcfe8; }

        /* Wide Navigation Cards */
        .section-header { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px 4px; }
        
        .wide-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text-main); backdrop-filter: blur(10px);
            transition: 0.2s;
        }
        .wide-card:active { transform: scale(0.98); border-color: #c084fc; }
        .wide-left { display: flex; align-items: center; gap: 14px; }
        .wide-icon {
            width: 36px; height: 36px; background: rgba(124, 58, 237, 0.15); color: #c084fc;
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .wide-info h4 { margin: 0; font-size: 13px; font-weight: 700; color: #fff; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: rgba(19, 28, 46, 0.95);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999;
            backdrop-filter: blur(15px); box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.6);
        }
        .nav-item {
            text-align: center; color: var(--text-muted);
            text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; transition: 0.2s;
        }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-crown"></i> WhiteFlowery Pro</h3>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> Home</a>
        </div>

        <!-- Profile Hero with ID -->
        <div class="profile-hero">
            <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
            <h2 class="profile-name" id="userNameDisplay">Loading...</h2>
            <div class="profile-id-tag" id="userIdDisplay">Telegram ID: #TG_------</div>
        </div>

        <!-- Admin Control Panel Banner -->
        <a href="myadmin.html" class="admin-banner-card">
            <div class="admin-info">
                <div class="admin-icon-box"><i class="fa-solid fa-user-shield"></i></div>
                <div class="admin-text">
                    <h4>Admin Control Panel</h4>
                    <p>Manage products, stock & support tickets</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #fbcfe8; font-size: 12px;"></i>
        </a>

        <!-- Menu Options -->
        <div class="section-header">Dashboard Hub</div>

        <a href="orders.html" class="wide-card">
            <div class="wide-left">
                <div class="wide-icon"><i class="fa-solid fa-box-archive"></i></div>
                <div class="wide-info"><h4>My Orders</h4></div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
        </a>

        <a href="cart.html" class="wide-card">
            <div class="wide-left">
                <div class="wide-icon" style="color: #38bdf8;"><i class="fa-solid fa-cart-shopping"></i></div>
                <div class="wide-info"><h4>My Cart</h4></div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
        </a>

        <a href="wishlist.html" class="wide-card">
            <div class="wide-left">
                <div class="wide-icon" style="color: #ec4899;"><i class="fa-solid fa-heart"></i></div>
                <div class="wide-info"><h4>Wishlist</h4></div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
        </a>

        <a href="address.html" class="wide-card">
            <div class="wide-left">
                <div class="wide-icon" style="color: #34d399;"><i class="fa-solid fa-location-dot"></i></div>
                <div class="wide-info"><h4>Delivery Address</h4></div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
        </a>

        <a href="payment.html" class="wide-card">
            <div class="wide-left">
                <div class="wide-icon" style="color: #fbbf24;"><i class="fa-solid fa-wallet"></i></div>
                <div class="wide-info"><h4>Payment Methods</h4></div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
        </a>

        <a href="support.html" class="wide-card">
            <div class="wide-left">
                <div class="wide-icon" style="color: #c084fc;"><i class="fa-solid fa-headset"></i></div>
                <div class="wide-info"><h4>Customer Support</h4></div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
        </a>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('userNameDisplay').innerText = user.first_name || "Valued Customer";
            document.getElementById('userIdDisplay').innerText = `Telegram ID: #TG_${user.id}`;
        } else {
            document.getElementById('userNameDisplay').innerText = "Zoha";
            document.getElementById('userIdDisplay').innerText = "Telegram ID: #TG_8849201";
        }
    </script>
</body>
</html>
