<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - User Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --accent-pink: #ec4899;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 90px 0;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 10px; font-size: 12px; text-decoration: none; }

        .profile-card { background: var(--primary-gradient); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4); }
        .profile-avatar { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; margin: 0 auto 10px auto; border: 2px solid rgba(255, 255, 255, 0.4); }
        .profile-name { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; color: #fff; }
        .profile-username { margin: 0 0 14px 0; font-size: 12px; color: #f3e8ff; opacity: 0.85; }

        .wallet-stats { display: flex; background: rgba(0, 0, 0, 0.2); border-radius: 14px; padding: 10px; justify-content: space-around; backdrop-filter: blur(5px); }
        .stat-item h4 { margin: 0 0 2px 0; font-size: 11px; color: #d8b4fe; font-weight: 600; }
        .stat-item p { margin: 0; font-size: 15px; font-weight: bold; color: #fbbf24; }

        .menu-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; overflow: hidden; margin-bottom: 16px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--card-border); text-decoration: none; color: var(--text-main); }
        .menu-item:last-child { border-bottom: none; }
        .menu-left { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; }
        .menu-left i { width: 32px; height: 32px; background: rgba(124, 58, 237, 0.15); color: #c084fc; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .menu-right { font-size: 12px; color: var(--text-muted); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-user-gear"></i> My Account</h3>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> Home</a>
        </div>

        <div class="profile-card">
            <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
            <h2 class="profile-name" id="userNameDisplay">Loading...</h2>
            <p class="profile-username" id="userUsernameDisplay">@username</p>
            
            <div class="wallet-stats">
                <div class="stat-item"><h4>Total Orders</h4><p>0</p></div>
                <div class="stat-item"><h4>Reward Points</h4><p>150 FLW</p></div>
                <div class="stat-item"><h4>Status</h4><p style="color: #34d399;">Active</p></div>
            </div>
        </div>

        <div class="menu-section">
            <a href="#" class="menu-item"><div class="menu-left"><i class="fa-solid fa-box-archive"></i> My Orders</div><div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div></a>
            <a href="#" class="menu-item"><div class="menu-left"><i class="fa-solid fa-location-dot"></i> Delivery Address</div><div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div></a>
        </div>
    </div>

    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('userNameDisplay').innerText = user.first_name || "Valued Customer";
            document.getElementById('userUsernameDisplay').innerText = user.username ? `@${user.username}` : `@id_${user.id}`;
        } else {
            document.getElementById('userNameDisplay').innerText = "Zoha";
            document.getElementById('userUsernameDisplay').innerText = "@zoha_flowery";
        }
    </script>
</body>
</html>
