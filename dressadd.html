<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Add New Dress</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 50px; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #ec4899, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 10px; font-size: 12px; text-decoration: none; }

        .admin-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .card-title { font-size: 13px; font-weight: 700; color: #fff; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 8px; box-sizing: border-box; font-size: 12px; outline: none; }
        textarea.form-control { resize: none; height: 70px; }
        
        .size-row-input { display: flex; gap: 6px; align-items: flex-end; margin-bottom: 10px; }
        .add-size-btn { background: #3b82f6; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; height: 38px; }

        .size-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; background: #0b0f19; border-radius: 8px; overflow: hidden; border: 1px solid var(--card-border); }
        .size-table th, .size-table td { padding: 8px; font-size: 11px; text-align: center; border-bottom: 1px solid var(--card-border); }
        .size-table th { background: rgba(124, 58, 237, 0.2); color: #c084fc; }
        .del-size { background: #ef4444; color: #fff; border: none; padding: 3px 6px; border-radius: 4px; font-size: 9px; cursor: pointer; }

        .submit-btn { background: var(--primary-gradient); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; margin-top: 6px; box-shadow: 0 4px 15px rgba(124,58,237,0.3); }
        .uploading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; color: #fff; font-size: 14px; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-plus-circle"></i> Add New Dress</h3>
            <a href="myadmin.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Admin Home</a>
        </div>

        <div class="admin-card">
            <h4 class="card-title"><i class="fa-solid fa-circle-plus"></i> Multi-Image & Dynamic Setup</h4>
            
            <div class="form-group">
                <label>Dress Name</label>
                <input type="text" id="newName" class="form-control" placeholder="e.g. Elegant White Frock">
            </div>

            <!-- Dynamic Category Management -->
            <div class="form-group">
                <label>Select Category</label>
                <div style="display: flex; gap: 6px;">
                    <select id="newCat" class="form-control" style="flex: 2;">
                        <!-- Categories loaded from localStorage -->
                    </select>
                    <input type="text" id="customCatInput" class="form-control" placeholder="New Cat..." style="flex: 1;">
                    <button type="button" class="add-size-btn" onclick="addNewCategory()" style="background:#10b981; height:38px;"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <!-- Rename Category -->
            <div class="form-group">
                <label>Rename Category</label>
                <div style="display: flex; gap: 6px;">
                    <select id="renameCatSelect" class="form-control" style="flex: 2;">
                        <!-- Categories loaded from localStorage -->
                    </select>
                    <input type="text" id="renameCatInput" class="form-control" placeholder="New name..." style="flex: 1;">
                    <button type="button" class="add-size-btn" onclick="renameCategory()" style="background:#f59e0b; height:38px;"><i class="fa-solid fa-pen"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label>Price (৳)</label>
                <input type="number" id="newPrice" class="form-control" placeholder="4500">
            </div>

            <div class="form-group">
                <label>Product Details / Description</label>
                <textarea id="newDetails" class="form-control" placeholder="Write fabric details, work, or description..."></textarea>
            </div>

            <!-- Size Setup -->
            <div class="size-row-input">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; display: block;">Select Size</label>
                    <select id="sizeDropdown" class="form-control">
                        <option value="S">S Size</option>
                        <option value="M">M Size</option>
                        <option value="L">L Size</option>
                        <option value="XL">XL Size</option>
                        <option value="XXL">XXL Size</option>
                        <option value="Free Size">Free Size</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; display: block;">Pieces (Qty)</label>
                    <input type="number" id="sizeQty" class="form-control" placeholder="10" value="1">
                </div>
                <button type="button" class="add-size-btn" onclick="addSizeToTable()"><i class="fa-solid fa-plus"></i> Add</button>
            </div>

            <table class="size-table">
                <thead>
                    <tr><th>Size</th><th>Pieces</th><th>Action</th></tr>
                </thead>
                <tbody id="sizeTableBody">
                    <tr><td colspan="3" style="color: var(--text-muted); font-size: 10px;">No sizes added yet.</td></tr>
                </tbody>
            </table>

            <!-- 3 Image Uploads (Min 1, Max 3) -->
            <div class="form-group">
                <label>Product Photo 1 (Required - Cloudinary)</label>
                <input type="file" id="imgFile1" class="form-control" accept="image/*" style="color: #94a3b8;">
            </div>
            <div class="form-group">
                <label>Product Photo 2 (Optional)</label>
                <input type="file" id="imgFile2" class="form-control" accept="image/*" style="color: #94a3b8;">
            </div>
            <div class="form-group">
                <label>Product Photo 3 (Optional)</label>
                <input type="file" id="imgFile3" class="form-control" accept="image/*" style="color: #94a3b8;">
            </div>

            <!-- Video Upload -->
            <div class="form-group">
                <label>Product Video (Optional)</label>
                <input type="file" id="productVideoFile" class="form-control" accept="video/*" style="color: #94a3b8;">
            </div>

            <button class="submit-btn" onclick="publishDress()"><i class="fa-solid fa-cloud-arrow-up"></i> Save & Add More</button>
        </div>
    </div>

    <div id="uploadOverlay" class="uploading-overlay">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #c084fc;"></i>
        <span>Uploading images & publishing dress...</span>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let addedSizesList = {};

        window.addEventListener('DOMContentLoaded', () => {
            loadCategoriesDropdown();
        });

        function loadCategoriesDropdown() {
            let catSelect = document.getElementById('newCat');
            let renameSelect = document.getElementById('renameCatSelect');
            let categories = JSON.parse(localStorage.getItem('shopCategories')) || ['Gowns', 'Party Wear', 'Casual Sets', 'Bridal'];
            
            catSelect.innerHTML = '';
            renameSelect.innerHTML = '';
            categories.forEach(cat => {
                catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                renameSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function renameCategory() {
            let oldName = document.getElementById('renameCatSelect').value;
            let newNameInput = document.getElementById('renameCatInput');
            let newName = newNameInput.value.trim();

            if (!oldName) { tg.showAlert("⚠️ No category selected!"); return; }
            if (!newName) { tg.showAlert("⚠️ Enter the new category name!"); return; }

            let categories = JSON.parse(localStorage.getItem('shopCategories')) || ['Gowns', 'Party Wear', 'Casual Sets', 'Bridal'];

            if (newName !== oldName && categories.includes(newName)) {
                tg.showAlert(`⚠️ Category "${newName}" already exists! Choose a different name.`);
                return;
            }

            // Rename in the category list
            categories = categories.map(c => c === oldName ? newName : c);
            localStorage.setItem('shopCategories', JSON.stringify(categories));

            // Update every existing dress that belonged to the old category name,
            // so already-published products don't get orphaned/hidden.
            let dresses = JSON.parse(localStorage.getItem('shopDresses')) || [];
            let updatedCount = 0;
            dresses = dresses.map(d => {
                if (d.category === oldName) {
                    updatedCount++;
                    return { ...d, category: newName };
                }
                return d;
            });
            localStorage.setItem('shopDresses', JSON.stringify(dresses));

            loadCategoriesDropdown();
            document.getElementById('newCat').value = newName;
            document.getElementById('renameCatSelect').value = newName;
            newNameInput.value = '';

            tg.showAlert(`✅ Category renamed to "${newName}"! (${updatedCount} product(s) updated)`);
        }

        function addNewCategory() {
            let customInput = document.getElementById('customCatInput');
            let newCat = customInput.value.trim();
            if(!newCat) { tg.showAlert("⚠️ Enter new category name!"); return; }

            let categories = JSON.parse(localStorage.getItem('shopCategories')) || ['Gowns', 'Party Wear', 'Casual Sets', 'Bridal'];
            if(!categories.includes(newCat)) {
                categories.push(newCat);
                localStorage.setItem('shopCategories', JSON.stringify(categories));
                loadCategoriesDropdown();
                document.getElementById('newCat').value = newCat;
                customInput.value = '';
                tg.showAlert(`✅ Category "${newCat}" created successfully!`);
            } else {
                tg.showAlert("⚠️ Category already exists!");
            }
        }

        function addSizeToTable() {
            let size = document.getElementById('sizeDropdown').value;
            let qty = parseInt(document.getElementById('sizeQty').value) || 0;
            if (qty <= 0) { tg.showAlert("⚠️ Enter valid quantity!"); return; }
            addedSizesList[size] = qty;
            renderSizeTable();
        }

        function removeSize(sizeKey) {
            delete addedSizesList[sizeKey];
            renderSizeTable();
        }

        function renderSizeTable() {
            let tbody = document.getElementById('sizeTableBody');
            let keys = Object.keys(addedSizesList);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="color: var(--text-muted); font-size: 10px;">No sizes added yet.</td></tr>`;
                return;
            }
            tbody.innerHTML = '';
            keys.forEach(size => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${size}</b></td>
                        <td style="color:#fbbf24; font-weight:bold;">${addedSizesList[size]} Pcs</td>
                        <td><button class="del-size" onclick="removeSize('${size}')"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }

        async function uploadToCloudinary(file) {
            let formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "ml_default");
            formData.append("folder", "shop/Product_add");

            // IMPORTANT: give every upload a guaranteed-unique public_id.
            // Without this, if Cloudinary's preset (or the browser's file
            // picker reusing the same filename, e.g. IMG_1234.jpg) ends up
            // generating the same public_id twice, Cloudinary can hand back
            // the URL of the OLD asset instead of storing the new photo —
            // so the upload "succeeds" but the image never actually
            // changes, and the same old picture keeps showing up.
            let uniqueId = "dress_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
            formData.append("public_id", uniqueId);

            try {
                let res = await fetch("https://api.cloudinary.com/v1_1/dyqegwdme/image/upload", { method: "POST", body: formData });
                let data = await res.json();

                if (!res.ok || !data.secure_url) {
                    console.error("Cloudinary upload rejected:", data.error ? data.error.message : data);
                    throw new Error(data.error ? data.error.message : "Cloudinary upload failed");
                }
                return data.secure_url;
            } catch (err) {
                console.error("Cloudinary upload error, falling back to local image:", err);
                return new Promise((resolve) => {
                    let reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve("");
                    reader.readAsDataURL(file);
                });
            }
        }

        async function publishDress() {
            let name = document.getElementById('newName').value.trim();
            let cat = document.getElementById('newCat').value;
            let price = parseFloat(document.getElementById('newPrice').value) || 0;
            let details = document.getElementById('newDetails').value.trim();
            
            let file1 = document.getElementById('imgFile1').files[0];
            let file2 = document.getElementById('imgFile2').files[0];
            let file3 = document.getElementById('imgFile3').files[0];
            let videoInput = document.getElementById('productVideoFile');
            let sizeKeys = Object.keys(addedSizesList);

            if (!name || price <= 0) { tg.showAlert("⚠️ Enter valid name and price!"); return; }
            if (sizeKeys.length === 0) { tg.showAlert("⚠️ Please add at least one size & quantity!"); return; }
            if (!file1) { tg.showAlert("⚠️ Product Photo 1 is required!"); return; }

            document.getElementById('uploadOverlay').style.display = 'flex';

            let images = [];
            let url1 = await uploadToCloudinary(file1);
            if(url1) {
                images.push(url1);
            } else {
                document.getElementById('uploadOverlay').style.display = 'none';
                tg.showAlert("❌ Photo 1 could not be uploaded or read. Please try a different image/file.");
                return;
            }

            if(file2) {
                let url2 = await uploadToCloudinary(file2);
                if(url2) images.push(url2);
            }
            if(file3) {
                let url3 = await uploadToCloudinary(file3);
                if(url3) images.push(url3);
            }

            let videoUrl = "";
            if(videoInput.files.length > 0) {
                videoUrl = await uploadToCloudinary(videoInput.files[0]);
            }

            document.getElementById('uploadOverlay').style.display = 'none';

            let totalStock = 0;
            sizeKeys.forEach(s => totalStock += addedSizesList[s]);

            let newDress = {
                id: 'WF-' + Math.floor(1000 + Math.random() * 9000),
                name: name,
                category: cat,
                price: price,
                details: details || "No details provided.",
                images: images, // Array of 1 to 3 images
                image: images[0], // Main thumbnail fallback
                video: videoUrl,
                sizes: addedSizesList,
                totalStock: totalStock
            };

            let dresses = JSON.parse(localStorage.getItem('shopDresses')) || [];
            dresses.unshift(newDress);
            localStorage.setItem('shopDresses', JSON.stringify(dresses));

            tg.showAlert(`✅ Dress "${name}" published successfully! Add more if you want.`);
            
            // Reset form for next entry
            document.getElementById('newName').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newDetails').value = '';
            document.getElementById('imgFile1').value = '';
            document.getElementById('imgFile2').value = '';
            document.getElementById('imgFile3').value = '';
            document.getElementById('productVideoFile').value = '';
            addedSizesList = {};
            renderSizeTable();
        }
    </script>
</body>
</html>
