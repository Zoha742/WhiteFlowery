<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - My Invoices</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: rgba(19, 28, 46, 0.85);
            --card-border: rgba(124, 58, 237, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 100px 0;
            display: flex; justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.18) 0%, transparent 60%);
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 12px; font-size: 12px; text-decoration: none; backdrop-filter: blur(10px); }

        /* Invoice List / Chart */
        .invoice-list { display: flex; flex-direction: column; gap: 14px; }
        .invoice-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 16px; backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); position: relative; overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }
        .invoice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
        .invoice-id { font-size: 13px; font-weight: bold; color: #c084fc; }
        .invoice-status { font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 6px; }

        .invoice-details { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .invoice-details span b { color: #fff; }

        .invoice-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--card-border); padding-top: 10px; gap: 8px; }
        .invoice-total { font-size: 14px; font-weight: bold; color: #fbbf24; }

        .invoice-btn-group { display: flex; gap: 6px; }
        .view-btn, .download-btn {
            border: none; color: #fff;
            padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
        }
        .view-btn { background: #1e293b; border: 1px solid var(--card-border); color: #c084fc; }
        .download-btn { background: var(--primary-gradient); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4); }
        .view-btn:active, .download-btn:active { transform: scale(0.96); }

        .no-invoice { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 13px; line-height: 1.6; }

        /* Invoice View Modal (rendered in a light, print-friendly style) */
        .invoice-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 99999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .invoice-modal-box {
            background: #fff; color: #1a1a1a; width: 100%; max-width: 400px;
            max-height: 85vh; overflow-y: auto; border-radius: 16px; padding: 22px;
            position: relative;
        }
        .invoice-modal-close { position: absolute; top: 10px; right: 14px; font-size: 22px; cursor: pointer; color: #444; }
        .invoice-modal-download-btn {
            background: var(--primary-gradient); border: none; color: #fff; width: 100%;
            padding: 10px; border-radius: 10px; font-weight: 700; font-size: 13px;
            cursor: pointer; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        /* Printable invoice template shared between the modal and direct download.
           Rows use a fixed-width label + a flexible, wrapping value column so long
           values (long item names, IDs, etc.) never overflow past the page edge. */
        .invoice-paper-header { text-align: center; margin-bottom: 14px; }
        .invoice-paper-header h2 { margin: 0; color: #7c3aed; font-size: 21px; font-weight: 800; }
        .invoice-paper-header p { margin: 3px 0 0 0; font-size: 11px; color: #777; }
        .invoice-paper-rows { border-top: 1px dashed #ccc; border-bottom: 1px dashed #ccc; padding: 10px 0; margin-bottom: 16px; }
        .invoice-paper-row { display: flex; padding: 5px 0; font-size: 12px; gap: 10px; }
        .invoice-paper-row .p-label { color: #666; width: 118px; flex-shrink: 0; }
        .invoice-paper-row .p-value { flex: 1; min-width: 0; font-weight: 700; color: #111; text-align: right; word-break: break-word; overflow-wrap: anywhere; }
        .invoice-paper-total { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: #111; margin-bottom: 14px; }
        .invoice-paper-total span:last-child { word-break: break-word; text-align: right; }
        .invoice-paper-footer { text-align: center; font-size: 10px; color: #999; }

        /* Hidden off-screen template used to generate a PDF without opening the modal.
           Sized generously (and explicitly captured at its full scroll size) so nothing clips. */
        #hiddenInvoiceTemplate { position: fixed; left: -9999px; top: 0; width: 360px; background: #fff; padding: 22px; box-sizing: border-box; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: rgba(19, 28, 46, 0.95);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999;
            backdrop-filter: blur(15px); box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.6);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-file-invoice-dollar"></i> My Invoices</h3>
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Profile</a>
        </div>

        <!-- Invoice Chart Container -->
        <div class="invoice-list" id="invoiceContainer">
            <!-- Dynamic Invoices will load here -->
            <div class="no-invoice">
                <i class="fa-solid fa-receipt" style="font-size: 32px; color: #4c1d95; margin-bottom: 10px; display: block;"></i>
                No invoices generated yet!<br>Admin will issue invoice upon order confirmation.
            </div>
        </div>
    </div>

    <!-- View Invoice Modal -->
    <div id="invoiceViewModal" class="invoice-modal-overlay">
        <div class="invoice-modal-box">
            <span class="invoice-modal-close" onclick="closeInvoiceView()">&times;</span>
            <div id="invoicePrintArea"></div>
            <button class="invoice-modal-download-btn" onclick="downloadInvoicePdfByIndex(currentViewIndex)">
                <i class="fa-solid fa-file-pdf"></i> Download as PDF
            </button>
        </div>
    </div>

    <!-- Hidden template used to render + snapshot a PDF without opening the modal -->
    <div id="hiddenInvoiceTemplate"></div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let allInvoices = [];
        let currentViewIndex = null;

        // ---------- Document-type helpers ----------
        // inv.type may be 'purchase' (default), 'exchange', or 'cashback'.
        // All of these extra fields (type, channel, userName, userId, time) are
        // OPTIONAL and backward-compatible: older invoice records that don't
        // have them will just skip those rows instead of breaking.
        function getInvoiceType(inv) {
            return inv.type || 'purchase';
        }

        function getStatusInfo(inv) {
            let type = getInvoiceType(inv);
            if (type === 'exchange') return { text: 'Exchange Processed', color: '#3b82f6', bg: 'rgba(59,130,246,0.15)', border: 'rgba(59,130,246,0.3)' };
            if (type === 'cashback') return { text: 'Cashback Issued', color: '#f59e0b', bg: 'rgba(245,158,11,0.15)', border: 'rgba(245,158,11,0.3)' };
            return { text: 'Paid & Confirmed', color: '#10b981', bg: 'rgba(16,185,129,0.15)', border: 'rgba(16,185,129,0.3)' };
        }

        function getDocTitle(inv) {
            let type = getInvoiceType(inv);
            if (type === 'exchange') return 'Exchange Receipt';
            if (type === 'cashback') return 'Cashback / Refund Receipt';
            return 'Official Invoice / Receipt';
        }

        // Load Invoices saved from Admin Panel automatically
        window.addEventListener('DOMContentLoaded', () => {
            let container = document.getElementById('invoiceContainer');
            allInvoices = JSON.parse(localStorage.getItem('userInvoices')) || [];

            if (allInvoices.length > 0) {
                container.innerHTML = '';
                allInvoices.forEach((inv, idx) => {
                    let status = getStatusInfo(inv);
                    container.innerHTML += `
                        <div class="invoice-card">
                            <div class="invoice-header">
                                <span class="invoice-id">#${inv.orderId}</span>
                                <span class="invoice-status" style="color:${status.color}; background:${status.bg}; border:1px solid ${status.border};">${status.text}</span>
                            </div>
                            <div class="invoice-details">
                                <span><b>Item:</b> ${inv.itemName}</span>
                                <span><b>Date:</b> ${inv.date}${inv.time ? ' , ' + inv.time : ''}</span>
                                <span><b>Payment:</b> ${inv.method}</span>
                                ${inv.channel ? `<span><b>Ordered Via:</b> ${inv.channel}</span>` : ''}
                            </div>
                            <div class="invoice-footer">
                                <span class="invoice-total">৳ ${Number(inv.amount).toLocaleString()}</span>
                                <div class="invoice-btn-group">
                                    <button class="view-btn" onclick="viewInvoice(${idx})"><i class="fa-solid fa-eye"></i> View</button>
                                    <button class="download-btn" onclick="downloadInvoicePdfByIndex(${idx})"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        });

        // Builds the clean, printable invoice markup shared by the View modal
        // and the direct-download hidden template (so both always look identical).
        function buildInvoicePaperHtml(inv) {
            let type = getInvoiceType(inv);
            let status = getStatusInfo(inv);

            let rows = [];
            rows.push(['Order ID', `#${inv.orderId}`]);
            rows.push(['Date & Time', `${inv.date}${inv.time ? ' , ' + inv.time : ''}`]);
            if (inv.userName) rows.push(['Customer Name', inv.userName]);
            if (inv.userId) rows.push(['Customer ID', inv.userId]);
            if (inv.channel) rows.push(['Ordered Via', inv.channel]);

            if (type === 'exchange') {
                rows.push(['Old Item', inv.itemName || 'N/A']);
                if (inv.newItemName) rows.push(['New Item', inv.newItemName]);
                if (inv.note) rows.push(['Note', inv.note]);
            } else if (type === 'cashback') {
                rows.push(['Related Item', inv.itemName || 'N/A']);
                if (inv.note) rows.push(['Reason', inv.note]);
            } else {
                rows.push(['Item', inv.itemName || 'N/A']);
            }

            rows.push(['Payment Method', inv.method || 'N/A']);
            rows.push(['Status', status.text, status.color]);

            let rowsHtml = rows.map(r => {
                let colorStyle = r[2] ? `color:${r[2]};` : '';
                return `<div class="invoice-paper-row"><span class="p-label">${r[0]}</span><span class="p-value" style="${colorStyle}">${r[1]}</span></div>`;
            }).join('');

            let amountLabel = type === 'cashback' ? 'Cashback Amount' : (type === 'exchange' ? 'Price Adjustment' : 'Total Amount');

            return `
                <div class="invoice-paper-header">
                    <h2>WhiteFlowery</h2>
                    <p>${getDocTitle(inv)}</p>
                </div>
                <div class="invoice-paper-rows">
                    ${rowsHtml}
                </div>
                <div class="invoice-paper-total">
                    <span>${amountLabel}</span>
                    <span>৳ ${Number(inv.amount || 0).toLocaleString()}</span>
                </div>
                <div class="invoice-paper-footer">Thank you for shopping with WhiteFlowery!</div>
            `;
        }

        function viewInvoice(idx) {
            currentViewIndex = idx;
            let inv = allInvoices[idx];
            document.getElementById('invoicePrintArea').innerHTML = buildInvoicePaperHtml(inv);
            document.getElementById('invoiceViewModal').style.display = 'flex';
        }

        function closeInvoiceView() {
            document.getElementById('invoiceViewModal').style.display = 'none';
        }

        // Renders the invoice into an off-screen template, snapshots it as an
        // image (so Bengali text/৳ renders correctly), then drops that image
        // into a PDF. Captures at the template's actual full scroll size so
        // nothing that overflows the visible box gets clipped.
        async function downloadInvoicePdfByIndex(idx) {
            if (idx === null || idx === undefined || !allInvoices[idx]) return;
            let inv = allInvoices[idx];

            let hiddenBox = document.getElementById('hiddenInvoiceTemplate');
            hiddenBox.innerHTML = buildInvoicePaperHtml(inv);

            try {
                let fullWidth = hiddenBox.scrollWidth;
                let fullHeight = hiddenBox.scrollHeight;

                let canvas = await html2canvas(hiddenBox, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    width: fullWidth,
                    height: fullHeight,
                    windowWidth: fullWidth,
                    windowHeight: fullHeight
                });
                let imgData = canvas.toDataURL('image/png');

                const { jsPDF } = window.jspdf;
                let pdfWidth = canvas.width / 2;
                let pdfHeight = canvas.height / 2;
                let pdf = new jsPDF({ unit: 'px', format: [pdfWidth, pdfHeight] });
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`Invoice_${inv.orderId}.pdf`);

                tg.showAlert(`📥 Invoice #${inv.orderId} downloaded as PDF!`);
            } catch (err) {
                console.error("PDF generation failed:", err);
                tg.showAlert("⚠️ Could not generate PDF. Please try again.");
            }
        }
    </script>
</body>
</html>
