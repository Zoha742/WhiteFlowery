<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Pro Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: rgba(19, 28, 46, 0.75);
            --card-border: rgba(124, 58, 237, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --accent-pink: #ec4899;
            --stock-green: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 95px 0;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 12px; font-size: 12px; text-decoration: none; }

        .search-box { position: relative; margin-bottom: 16px; }
        .search-input { width: 100%; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 16px 12px 42px; border-radius: 14px; color: #fff; font-size: 13px; outline: none; box-sizing: border-box; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--text-muted); }
        .cat-chip.active, .cat-chip:hover { background: #7c3aed; color: #fff; border-color: #7c3aed; }

        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        
        .product-img-box { width: 100%; height: 140px; background: #0b0f19; border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .product-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .product-img-box:hover img { transform: scale(1.1); }

        .product-title { margin: 0 0 2px 0; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { margin: 0 0 6px 0; font-size: 13px; font-weight: bold; color: #fbbf24; }

        .meta-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 10px; }
        .stock-badge { color: var(--stock-green); background: rgba(16, 185, 129, 0.1); padding: 2px 6px; border-radius: 6px; font-weight: bold; }
        
        .size-box { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
        .size-pill { background: #0b0f19; border: 1px solid var(--card-border); color: var(--text-muted); font-size: 9px; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .size-pill.selected { background: #7c3aed; color: #fff; border-color: #7c3aed; }

        .card-action-row { display: flex; gap: 4px; margin-bottom: 6px; }
        .btn-mini { background: #1e293b; border: 1px solid var(--card-border); color: #c084fc; font-size: 9px; padding: 4px 6px; border-radius: 6px; cursor: pointer; flex: 1; text-align: center; font-weight: bold; }
        
        .add-to-cart-btn { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; border: none; padding: 8px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; width: 100%; }

        /* Modals & Zoom */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); width: 90%; max-width: 400px; padding: 16px; border-radius: 16px; position: relative; text-align: center; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: rgba(19, 28, 46, 0.95);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(15px);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-store"></i> WhiteFlowery Pro Shop</h3>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search dresses..." onkeyup="renderProducts()">
        </div>

        <!-- Dynamic Category Chips -->
        <div class="categories-scroll" id="categoriesContainer">
            <div class="cat-chip active" onclick="filterCategory('All', this)">All Dresses</div>
        </div>

        <div class="products-grid" id="shopProductsGrid">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Zoom Image Modal -->
    <div id="zoomModal" class="modal-overlay">
        <div class="modal-content" style="background:#0b0f19;">
            <span style="position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; color:#fff; z-index:10;" onclick="closeModal('zoomModal')">&times;</span>
            <img id="zoomedImg" src="" alt="Zoom" style="width:100%; max-height:320px; object-fit:contain; border-radius:8px; margin-bottom:10px;">
            <div id="zoomThumbnails" style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;"></div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-overlay">
        <div class="modal-content" style="text-align: left;">
            <span style="position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; color:#fff;" onclick="closeModal('detailsModal')">&times;</span>
            <h4 id="modalTitle" style="color:#c084fc; margin-top:0;">Product Details</h4>
            <p id="modalDescription" style="font-size:12px; color:var(--text-muted); line-height:1.6;"></p>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="videoModal" class="modal-overlay">
        <div class="modal-content">
            <span style="position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; color:#fff;" onclick="closeModal('videoModal')">&times;</span>
            <h4 style="color:#fff; margin-top:0;">Product Video</h4>
            <video id="modalVideoPlayer" src="" controls style="width:100%; max-height:280px; border-radius:8px; border:1px solid var(--card-border);"></video>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentCategory = 'All';
        let currentFilteredDresses = [];

        window.addEventListener('DOMContentLoaded', () => {
            cleanOldDummyProducts();
            loadDynamicCategories();
            renderProducts();
        });

        function cleanOldDummyProducts() {
            let dresses = JSON.parse(localStorage.getItem('shopDresses')) || [];
            let cleanDresses = dresses.filter(d => {
                let isDummy = (d.id === 'WF-1' || d.name === 'Royal Silk Gown' || (d.image && d.image.includes('unsplash.com')));
                return !isDummy;
            });
            localStorage.setItem('shopDresses', JSON.stringify(cleanDresses));
        }

        function loadDynamicCategories() {
            let container = document.getElementById('categoriesContainer');
            let categories = JSON.parse(localStorage.getItem('shopCategories')) || ['Gowns', 'Party Wear', 'Casual Sets', 'Bridal'];
            
            container.innerHTML = `<div class="cat-chip active" onclick="filterCategory('All', this)">All Dresses</div>`;
            categories.forEach(cat => {
                container.innerHTML += `<div class="cat-chip" onclick="filterCategory('${cat}', this)">${cat}</div>`;
            });
        }

        function renderProducts() {
            let grid = document.getElementById('shopProductsGrid');
            let dresses = JSON.parse(localStorage.getItem('shopDresses')) || [];
            let searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            grid.innerHTML = '';
            
            currentFilteredDresses = dresses.filter(d => {
                let matchesCat = (currentCategory === 'All' || d.category === currentCategory);
                let matchesSearch = d.name.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            if (currentFilteredDresses.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align:center; color: var(--text-muted); padding: 30px; font-size: 12px;">No dresses found.</div>`;
                return;
            }

            currentFilteredDresses.forEach((dress, index) => {
                let sizesObj = dress.sizes || {};
                let sizeKeys = Object.keys(sizesObj);
                let firstSize = sizeKeys.length > 0 ? sizeKeys[0] : '';
                let initialStock = firstSize ? sizesObj[firstSize] : 0;
                
                let sizePillsHtml = '';
                sizeKeys.forEach((sizeKey, sIdx) => {
                    let cls = sIdx === 0 ? 'size-pill selected' : 'size-pill';
                    sizePillsHtml += `<span class="${cls}" onclick="selectSize(this, '${sizeKey}', ${sizesObj[sizeKey]}, ${index})">${sizeKey}</span>`;
                });

                let mainImg = dress.image || '';
                if (dress.images && dress.images.length > 0) {
                    mainImg = dress.images[0];
                }

                let videoBtn = dress.video ? `<button class="btn-mini" onclick="openVideoModal('${dress.video}')"><i class="fa-solid fa-play"></i> Video</button>` : `<button class="btn-mini" style="opacity:0.4; cursor:not-allowed;" title="No video">No Video</button>`;

                grid.innerHTML += `
                    <div class="product-card" id="card-${index}">
                        <div class="product-img-box" onclick="openZoomModal(${index})">
                            <img src="${mainImg}" alt="${dress.name}" onerror="this.src='https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/2_g6yybc.webp'">
                        </div>
                        <div>
                            <h4 class="product-title">${dress.name}</h4>
                            <p class="product-price">৳ ${Number(dress.price).toLocaleString()}</p>
                            <div class="meta-info">
                                <span class="stock-badge" id="stock-text-${index}">Stock (${firstSize || 'N/A'}): ${initialStock} Pcs</span>
                            </div>
                            <div class="size-box">
                                ${sizePillsHtml || '<span style="font-size:9px; color:#ef4444;">Stock Out</span>'}
                            </div>
                            <div class="card-action-row">
                                <button class="btn-mini" onclick="openDetailsModal('${dress.name}', \`${dress.details || 'No details'}\`)"><i class="fa-solid fa-circle-info"></i> Details</button>
                                ${videoBtn}
                            </div>
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart('${dress.name}', ${dress.price})">Add to Cart</button>
                    </div>
                `;
            });
        }

        function selectSize(pill, sizeKey, qty, cardIndex) {
            let parent = pill.parentElement;
            parent.querySelectorAll('.size-pill').forEach(p => p.classList.remove('selected'));
            pill.classList.add('selected');
            document.getElementById(`stock-text-${cardIndex}`).innerText = `Stock (${sizeKey}): ${qty} Pcs`;
        }

        function openZoomModal(index) {
            let dress = currentFilteredDresses[index];
            if (!dress) return;

            let images = dress.images && dress.images.length > 0 ? dress.images : [dress.image];
            let mainImageEl = document.getElementById('zoomedImg');
            let thumbContainer = document.getElementById('zoomThumbnails');

            mainImageEl.src = images[0];
            thumbContainer.innerHTML = '';

            if (images.length > 1) {
                images.forEach((imgUrl) => {
                    thumbContainer.innerHTML += `
                        <img src="${imgUrl}" onclick="document.getElementById('zoomedImg').src='${imgUrl}'" style="width:45px; height:55px; object-fit:cover; border-radius:4px; border:1px solid #7c3aed; cursor:pointer;">
                    `;
                });
            }

            document.getElementById('zoomModal').style.display = 'flex';
        }

        function openDetailsModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDescription').innerText = desc;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function openVideoModal(videoUrl) {
            let player = document.getElementById('modalVideoPlayer');
            player.src = videoUrl;
            document.getElementById('videoModal').style.display = 'flex';
            player.play();
        }

        function closeModal(modalId) {
            if(modalId === 'videoModal') {
                document.getElementById('modalVideoPlayer').pause();
            }
            document.getElementById(modalId).style.display = 'none';
        }

        function filterCategory(cat, chip) {
            currentCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            renderProducts();
        }

        function addToCart(itemName, price) {
            tg.showAlert(`✅ Added "${itemName}" to cart! (৳ ${price.toLocaleString()})`);
        }
    </script>
</body>
</html>
