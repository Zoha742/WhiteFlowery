<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Pro Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --btn-dark: #222222;
            --price-color: #111111;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 95px 0;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 12px; box-sizing: border-box; }

        /* Top Bar: Filter & Sort */
        .top-filter-bar { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
        .filter-btn-box, .sort-select-box {
            flex: 1; background: #ffffff; border: 1px solid #d1d5db; padding: 10px 12px;
            border-radius: 6px; font-size: 13px; font-weight: 600; color: #374151;
            display: flex; align-items: center; justify-content: space-between; cursor: pointer;
            outline: none; box-sizing: border-box;
        }
        .sort-select-box select { background: transparent; border: none; font-size: 13px; font-weight: 600; color: #374151; width: 100%; outline: none; cursor: pointer; }

        /* Products Grid (2 Columns, Big Portrait Image) */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .product-card { background: var(--card-bg); display: flex; flex-direction: column; justify-content: space-between; position: relative; margin-bottom: 10px; }
        
        /* Big Portrait Image Box */
        .product-img-box { width: 100%; height: 250px; background: #f3f4f6; border-radius: 4px; overflow: hidden; position: relative; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .product-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .product-img-box:hover img { transform: scale(1.05); }

        /* Add to Cart Button directly under image */
        .add-to-cart-btn { background: var(--btn-dark); color: #fff; border: none; padding: 11px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 8px; text-align: center; letter-spacing: 0.3px; }
        .add-to-cart-btn:active { opacity: 0.85; }

        .product-title { margin: 0 0 4px 0; font-size: 13px; font-weight: 500; color: #1f2937; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { margin: 0; font-size: 13px; font-weight: 700; color: var(--price-color); text-align: center; }

        /* Stock & Size info popup/display */
        .info-tag { font-size: 10px; color: #059669; text-align: center; margin-bottom: 4px; font-weight: 600; }

        /* Modals & Zoom */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #ffffff; border: 1px solid #e5e7eb; width: 90%; max-width: 400px; padding: 18px; border-radius: 12px; position: relative; text-align: center; color: #111; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(15px);
        }
        .nav-item { text-align: center; color: #6b7280; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #7c3aed; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Filter & Sort Bar (Matched with reference screenshot) -->
        <div class="top-filter-bar">
            <div class="filter-btn-box" onclick="toggleFilterModal()">
                <span><i class="fa-solid fa-sliders"></i> Filter By</span>
                <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i>
            </div>
            <div class="sort-select-box">
                <select id="sortDropdown" onchange="sortProducts()">
                    <option value="new">Date, new to old</option>
                    <option value="old">Date, old to new</option>
                    <option value="price-low">Price, low to high</option>
                    <option value="price-high">Price, high to low</option>
                </select>
            </div>
        </div>

        <div class="products-grid" id="shopProductsGrid">
            <!-- Dynamically loaded products -->
        </div>
    </div>

    <!-- Zoom Image Modal -->
    <div id="zoomModal" class="modal-overlay">
        <div class="modal-content" style="background:#fff;">
            <span style="position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; color:#111; z-index:10;" onclick="closeModal('zoomModal')">&times;</span>
            <img id="zoomedImg" src="" alt="Zoom" style="width:100%; max-height:320px; object-fit:contain; border-radius:8px; margin-bottom:10px;">
            <div id="zoomThumbnails" style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;"></div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-overlay">
        <div class="modal-content" style="text-align: left;">
            <span style="position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; color:#111;" onclick="closeModal('detailsModal')">&times;</span>
            <h4 id="modalTitle" style="color:#111; margin-top:0;">Product Details</h4>
            <p id="modalDescription" style="font-size:12px; color:#555; line-height:1.6;"></p>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="videoModal" class="modal-overlay">
        <div class="modal-content">
            <span style="position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; color:#111;" onclick="closeModal('videoModal')">&times;</span>
            <h4 style="color:#111; margin-top:0;">Product Video</h4>
            <video id="modalVideoPlayer" src="" controls style="width:100%; max-height:280px; border-radius:8px;"></video>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentFilteredDresses = [];

        window.addEventListener('DOMContentLoaded', () => {
            forceCleanStorage();
            renderProducts();
        });

        function forceCleanStorage() {
            let dresses = JSON.parse(localStorage.getItem('shopDresses')) || [];
            let validDresses = dresses.filter(d => {
                let name = (d.name || "").toLowerCase();
                let isUnsplash = d.image && d.image.includes('unsplash.com');
                let isRoyalSilk = name.includes('royal silk') || d.id === 'WF-1';
                return !isUnsplash && !isRoyalSilk && d.name;
            });
            localStorage.setItem('shopDresses', JSON.stringify(validDresses));
        }

        function renderProducts() {
            let grid = document.getElementById('shopProductsGrid');
            let dresses = JSON.parse(localStorage.getItem('shopDresses')) || [];
            let sortType = document.getElementById('sortDropdown').value;

            // Sorting logic
            if (sortType === 'price-low') {
                dresses.sort((a, b) => a.price - b.price);
            } else if (sortType === 'price-high') {
                dresses.sort((a, b) => b.price - a.price);
            } else if (sortType === 'old') {
                // Keep original order
            } else {
                // New to old (Reverse)
                dresses.reverse();
            }

            currentFilteredDresses = dresses;
            grid.innerHTML = '';

            if (currentFilteredDresses.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align:center; color: #666; padding: 40px; font-size: 13px;">No dresses found. Please add from admin panel.</div>`;
                return;
            }

            currentFilteredDresses.forEach((dress, index) => {
                let mainImg = dress.image || '';
                if (dress.images && dress.images.length > 0) {
                    mainImg = dress.images[0];
                }

                grid.innerHTML += `
                    <div class="product-card" id="card-${index}">
                        <div class="product-img-box" onclick="openZoomModal(${index})">
                            <img src="${mainImg}" alt="${dress.name}" onerror="this.src='https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/2_g6yybc.webp'">
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart(${index})">Add to cart</button>
                        <div>
                            <h4 class="product-title">${dress.name}</h4>
                            <p class="product-price">Tk ${Number(dress.price).toLocaleString()}.00</p>
                        </div>
                    </div>
                `;
            });
        }

        function sortProducts() {
            renderProducts();
        }

        function toggleFilterModal() {
            tg.showAlert("💡 Filter options can be customized based on categories!");
        }

        function openZoomModal(index) {
            let dress = currentFilteredDresses[index];
            if (!dress) return;

            let images = dress.images && dress.images.length > 0 ? dress.images : [dress.image];
            let mainImageEl = document.getElementById('zoomedImg');
            let thumbContainer = document.getElementById('zoomThumbnails');

            mainImageEl.src = images[0];
            thumbContainer.innerHTML = '';

            if (images.length > 1) {
                images.forEach((imgUrl) => {
                    thumbContainer.innerHTML += `
                        <img src="${imgUrl}" onclick="document.getElementById('zoomedImg').src='${imgUrl}'" style="width:45px; height:55px; object-fit:cover; border-radius:4px; border:1px solid #7c3aed; cursor:pointer;">
                    `;
                });
            }

            document.getElementById('zoomModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function addToCart(cardIndex) {
            let dress = currentFilteredDresses[cardIndex];
            if (!dress) return;

            let cart = JSON.parse(localStorage.getItem('cartItems')) || [];
            let itemKey = dress.id || dress.name;
            let existing = cart.find(it => it.key === itemKey);

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    key: itemKey,
                    name: dress.name,
                    price: Number(dress.price),
                    image: dress.image || '',
                    qty: 1
                });
            }

            localStorage.setItem('cartItems', JSON.stringify(cart));
            tg.showAlert(`✅ Added "${dress.name}" to cart! (Tk ${Number(dress.price).toLocaleString()}.00)`);
        }
    </script>
</body>
</html>
