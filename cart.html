<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Cart & Checkout</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --accent-pink: #ec4899;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 100px 0;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 10px; font-size: 12px; text-decoration: none; }

        /* Cart Items List */
        .cart-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .cart-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .cart-item-info { display: flex; align-items: center; gap: 12px; }
        .cart-item-img { width: 50px; height: 50px; background: #0b0f19; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #ec4899; }
        .cart-item-title { margin: 0 0 4px 0; font-size: 13px; font-weight: 700; color: #fff; }
        .cart-item-price { margin: 0; font-size: 12px; font-weight: bold; color: #fbbf24; }

        .quantity-control { display: flex; align-items: center; gap: 8px; background: #0b0f19; border: 1px solid var(--card-border); padding: 4px 8px; border-radius: 8px; }
        .qty-btn { background: none; border: none; color: #c084fc; cursor: pointer; font-size: 12px; font-weight: bold; }
        .qty-val { font-size: 12px; font-weight: bold; color: #fff; }

        /* Checkout Summary Card */
        .summary-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .summary-row.total { font-size: 15px; font-weight: bold; color: #fff; border-top: 1px solid var(--card-border); padding-top: 10px; margin-top: 10px; }
        .summary-row.total span:last-child { color: #fbbf24; }

        /* Checkout Form Inputs */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 10px; box-sizing: border-box; font-size: 13px; outline: none; }
        .form-control:focus { border-color: #7c3aed; }

        .checkout-btn { background: var(--primary-gradient); color: #fff; border: none; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; font-size: 14px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }
        .checkout-btn:active { transform: scale(0.98); }

        .empty-cart { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 13px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-cart-shopping"></i> My Shopping Cart</h3>
            <a href="shop.html" class="back-btn"><i class="fa-solid fa-store"></i> Shop</a>
        </div>

        <!-- Cart Items Container -->
        <div id="cartListContainer" class="cart-list">
            <!-- ডেমো আইটেম (পরে ফায়ারবেস বা লোকালস্টোরেজ দিয়ে ডাইনামিক করা হবে) -->
            <div class="cart-item">
                <div class="cart-item-info">
                    <div class="cart-item-img"><i class="fa-solid fa-bouquet"></i></div>
                    <div>
                        <h4 class="cart-item-title">White Rose Bouquet</h4>
                        <p class="cart-item-price">$25.00</p>
                    </div>
                </div>
                <div class="quantity-control">
                    <button class="qty-btn">-</button>
                    <span class="qty-val">1</span>
                    <button class="qty-btn">+</button>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="summary-card">
            <div class="summary-row"><span>Subtotal</span><span>$25.00</span></div>
            <div class="summary-row"><span>Delivery Fee</span><span>$5.00</span></div>
            <div class="summary-row total"><span>Total Amount</span><span>$30.00</span></div>
        </div>

        <!-- Checkout Form -->
        <div class="summary-card">
            <h4 style="margin: 0 0 12px 0; font-size: 14px; color: #fbbf24;"><i class="fa-solid fa-truck-fast"></i> Delivery Information</h4>
            <div class="form-group">
                <label>Receiver Name</label>
                <input type="text" id="receiverName" class="form-control" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="receiverPhone" class="form-control" placeholder="e.g. 017xxxxxxxx">
            </div>
            <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" id="receiverAddress" class="form-control" placeholder="House, Road, Area, City">
            </div>
            <button class="checkout-btn" onclick="placeOrder()">Place Order Now</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item active" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        let tg = window.Telegram.WebApp;
        tg.expand();

        window.placeOrder = function() {
            let name = document.getElementById('receiverName').value.trim();
            let phone = document.getElementById('receiverPhone').value.trim();
            let address = document.getElementById('receiverAddress').value.trim();

            if(!name || !phone || !address) {
                tg.showAlert("⚠️ Please fill up all delivery information!");
                return;
            }

            tg.showAlert("🎉 Order placed successfully! Our support team will contact you soon.");
            window.location.href = "profile.html";
        }
    </script>
</body>
</html>
