<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteFlowery - Pro Cart & Duplicate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: rgba(19, 28, 46, 0.85);
            --card-border: rgba(124, 58, 237, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            --accent-pink: #ec4899;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 100px 0;
            display: flex; justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.18) 0%, transparent 60%);
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-title { margin: 0; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 12px; font-size: 12px; text-decoration: none; backdrop-filter: blur(10px); }

        /* Cart Items List & Swipe Container */
        .cart-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
        
        .cart-item-wrapper {
            position: relative; overflow: hidden; border-radius: 16px; background: #ef4444;
        }
        .delete-swipe-action {
            position: absolute; right: 0; top: 0; bottom: 0; width: 80px;
            background: #ef4444; color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; gap: 4px; cursor: pointer;
        }

        .cart-item {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 14px; position: relative; z-index: 2;
            transition: transform 0.2s ease; backdrop-filter: blur(10px);
        }
        
        .cart-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .cart-item-info { display: flex; align-items: center; gap: 12px; }
        .cart-item-img { width: 55px; height: 55px; background: #0b0f19; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .cart-item-title { margin: 0 0 2px 0; font-size: 13px; font-weight: 700; color: #fff; }
        .cart-item-price { margin: 0 0 4px 0; font-size: 13px; font-weight: bold; color: #fbbf24; }
        
        .cart-size-select {
            background: #0b0f19; border: 1px solid var(--card-border); color: #fff;
            padding: 2px 6px; border-radius: 6px; font-size: 10px; outline: none; font-weight: bold;
        }

        .quantity-control { display: flex; align-items: center; gap: 8px; background: #0b0f19; border: 1px solid var(--card-border); padding: 4px 8px; border-radius: 8px; }
        .qty-btn { background: none; border: none; color: #c084fc; cursor: pointer; font-size: 12px; font-weight: bold; }
        .qty-val { font-size: 12px; font-weight: bold; color: #fff; }

        /* Duplicate Button Under Each Dress */
        .cart-item-footer {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--card-border); padding-top: 8px; margin-top: 8px;
        }
        .duplicate-btn {
            background: rgba(124, 58, 237, 0.15); border: 1px solid rgba(124, 58, 237, 0.4);
            color: #d8b4fe; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s;
        }
        .duplicate-btn:active { background: #7c3aed; color: #fff; }

        /* Summary Card */
        .summary-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 16px; margin-bottom: 16px; backdrop-filter: blur(10px);
        }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .summary-row.total { font-size: 15px; font-weight: bold; color: #fff; border-top: 1px solid var(--card-border); padding-top: 10px; margin-top: 10px; }
        .summary-row.total span:last-child { color: #fbbf24; }

        /* Change Address Option at the Bottom */
        .change-address-box {
            background: rgba(124, 58, 237, 0.1); border: 1px dashed rgba(124, 58, 237, 0.4);
            border-radius: 14px; padding: 12px 16px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .change-address-box span { font-size: 12px; color: #d8b4fe; font-weight: 600; }
        .change-addr-btn { background: none; border: none; color: #ec4899; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: underline; }

        .checkout-btn {
            background: var(--primary-gradient); color: #fff; border: none;
            padding: 14px; border-radius: 14px; font-weight: 700; width: 100%;
            cursor: pointer; font-size: 14px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .checkout-btn:active { transform: scale(0.98); }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: rgba(19, 28, 46, 0.95);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0 14px 0; box-sizing: border-box; z-index: 9999;
            backdrop-filter: blur(15px); box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.6);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <h3 class="brand-title"><i class="fa-solid fa-cart-shopping"></i> My Shopping Cart</h3>
            <a href="shop.html" class="back-btn"><i class="fa-solid fa-store"></i> Shop</a>
        </div>

        <!-- Cart Items List with Swipe & Duplicate -->
        <div class="cart-list" id="cartContainer">
            
            <!-- Item 1 -->
            <div class="cart-item-wrapper">
                <div class="delete-swipe-action" onclick="removeItem(this)"><i class="fa-solid fa-trash"></i> Delete</div>
                <div class="cart-item" ontouchstart="touchStart(event)" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">
                    <div class="cart-item-top">
                        <div class="cart-item-info">
                            <div class="cart-item-img">
                                <img src="https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/2_g6yybc.webp" alt="Gown">
                            </div>
                            <div>
                                <h4 class="cart-item-title">Royal Silk Gown</h4>
                                <p class="cart-item-price" data-base="8500">৳ 8,500</p>
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span style="font-size: 10px; color: var(--text-muted);">Size:</span>
                                    <select class="cart-size-select">
                                        <option value="S">S</option>
                                        <option value="M" selected>M</option>
                                        <option value="L">L</option>
                                        <option value="XL">XL</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
                            <span class="qty-val">1</span>
                            <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
                        </div>
                    </div>
                    <div class="cart-item-footer">
                        <span style="font-size: 10px; color: var(--text-muted);"><i class="fa-solid fa-arrow-left-long"></i> Swipe left to delete</span>
                        <button class="duplicate-btn" onclick="duplicateItem(this)"><i class="fa-solid fa-copy"></i> Duplicate</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Order Summary -->
        <div class="summary-card">
            <div class="summary-row"><span>Subtotal</span><span id="subTotal">৳ 8,500</span></div>
            <div class="summary-row"><span>Delivery Fee</span><span>৳ 100</span></div>
            <div class="summary-row total"><span>Total Amount</span><span id="grandTotal">৳ 8,600</span></div>
        </div>

        <!-- Change Address Option at the Bottom -->
        <div class="change-address-box">
            <span><i class="fa-solid fa-location-dot" style="color: #c084fc;"></i> Delivery Address: <b id="addressStatus">Set</b></span>
            <button class="change-addr-btn" onclick="location.href='address.html'">Change Address</button>
        </div>

        <!-- Checkout Button -->
        <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="shop.html"><i class="fa-solid fa-store"></i>Shop</a>
        <a class="nav-item active" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Quantity Update & Double Price Logic
        function updateQty(btn, change) {
            let qtyVal = btn.parentElement.querySelector('.qty-val');
            let priceEl = btn.closest('.cart-item').querySelector('.cart-item-price');
            let basePrice = parseInt(priceEl.getAttribute('data-base'));
            
            let currentQty = parseInt(qtyVal.innerText) + change;
            if(currentQty < 1) return;

            qtyVal.innerText = currentQty;
            let calculatedPrice = basePrice * currentQty;
            priceEl.innerText = `৳ ${calculatedPrice.toLocaleString()}`;
            
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.cart-item').forEach(item => {
                let priceText = item.querySelector('.cart-item-price').innerText.replace('৳', '').replace(/,/g, '').trim();
                total += parseInt(priceText);
            });
            document.getElementById('subTotal').innerText = `৳ ${total.toLocaleString()}`;
            document.getElementById('grandTotal').innerText = `৳ ${(total + 100).toLocaleString()}`;
        }

        // Duplicate Item Logic
        function duplicateItem(btn) {
            let cardWrapper = btn.closest('.cart-item-wrapper');
            let clone = cardWrapper.cloneNode(true);
            document.getElementById('cartContainer').appendChild(clone);
            calculateTotal();
            tg.showAlert("✅ Dress duplicated successfully!");
        }

        // Remove Item
        function removeItem(el) {
            el.closest('.cart-item-wrapper').remove();
            calculateTotal();
            tg.showAlert("🗑️ Item removed from cart!");
        }

        // Swipe Gesture Logic for Mobile
        let startX = 0;
        function touchStart(e) { startX = e.touches[0].clientX; }
        function touchMove(e) {
            let diff = e.touches[0].clientX - startX;
            let card = e.currentTarget;
            if(diff < -30) {
                card.style.transform = `translateX(-80px)`;
            } else if(diff > 30) {
                card.style.transform = `translateX(0px)`;
            }
        }
        function touchEnd(e) {}

        function proceedToCheckout() {
            // Check if address exists in localStorage
            let savedAddress = localStorage.getItem('userFullAddress') || localStorage.getItem('userAddress');

            if(!savedAddress) {
                tg.showAlert("⚠️ Delivery address not found! Please set your address first.");
                window.location.href = "address.html";
                return;
            }

            tg.showAlert("🎉 Order placed successfully! Proceeding to payment.");
            window.location.href = "payment.html";
        }
    </script>
</body>
</html>
